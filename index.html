function cn(...args){ return args.filter(Boolean).join(' '); }

// ---------- shadcn-style primitives ----------

function Button({ variant='default', size='default', className='', children, ...props }){
  const base = 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50';
  const variants = {
    default: 'bg-primary text-primary-foreground hover:bg-primary/90',
    secondary: 'bg-secondary text-secondary-foreground hover:bg-secondary/80',
    outline: 'border border-input bg-transparent hover:bg-accent hover:text-accent-foreground',
    ghost: 'hover:bg-accent hover:text-accent-foreground',
    destructive: 'bg-destructive text-destructive-foreground hover:bg-destructive/90',
  };
  const sizes = { default: 'h-9 px-4 py-2', sm: 'h-8 px-3 text-xs', icon: 'h-8 w-8' };
  return html`<button class=${cn(base, variants[variant], sizes[size], className)} ...${props}>${children}</button>`;
}

function Input({ className='', ...props }){
  return html`<input class=${cn('flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50', className)} ...${props} />`;
}

function Textarea({ className='', ...props }){
  return html`<textarea class=${cn('flex w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50', className)} ...${props} />`;
}

function Select({ className='', children, ...props }){
  return html`<select class=${cn('flex h-9 w-full items-center rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50', className)} ...${props}>${children}</select>`;
}

function Label({ className='', children, ...props }){
  return html`<label class=${cn('text-xs font-medium text-muted-foreground mb-1.5 block', className)} ...${props}>${children}</label>`;
}

function Card({ className='', children, ...props }){
  return html`<div class=${cn('rounded-lg border border-border bg-card text-card-foreground shadow-sm', className)} ...${props}>${children}</div>`;
}

function Badge({ variant='default', className='', children }){
  const variants = {
    default: 'bg-accent text-accent-foreground border-transparent',
    success: 'bg-success/15 text-success border-transparent',
    warning: 'bg-warning/15 text-warning border-transparent',
    destructive: 'bg-destructive/15 text-destructive border-transparent',
    outline: 'text-foreground border-border',
  };
  return html`<span class=${cn('inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-medium whitespace-nowrap', variants[variant], className)}>${children}</span>`;
}

function Switch({ checked, onChange }){
  return html`
    <button type="button" role="switch" aria-checked=${checked}
      class=${cn('inline-flex h-5 w-9 shrink-0 items-center rounded-full transition-colors border border-transparent', checked ? 'bg-primary' : 'bg-input')}
      onClick=${() => onChange(!checked)}>
      <span class=${cn('inline-block h-4 w-4 rounded-full bg-background shadow transform transition-transform', checked ? 'translate-x-4' : 'translate-x-0.5')}></span>
    <//>
  `;
}

function Dialog({ open, onOpenChange, title, description, children }){
  if(!open) return null;
  return html`
    <div class="fixed inset-0 z-50 bg-black/70 flex items-start justify-center overflow-auto p-6 md:p-10" onMouseDown=${(e) => { if(e.target === e.currentTarget) onOpenChange(false); }}>
      <div class="w-full max-w-lg rounded-lg border border-border bg-card p-6 shadow-lg">
        <div class="flex items-start justify-between mb-1">
          <h2 class="text-base font-semibold">${title}</h2>
          <button class="text-muted-foreground hover:text-foreground" onClick=${() => onOpenChange(false)}>${Icon('x')}</button>
        </div>
        ${description ? html`<p class="text-sm text-muted-foreground mb-4">${description}</p>` : null}
        ${children}
      </div>
    </div>
  `;
}

function NewItemDialog({ open, onOpenChange, title, label, placeholder, onSubmit }){
  const [value, setValue] = useState('');
  const [saving, setSaving] = useState(false);
  useEffect(() => { if(open) setValue(''); }, [open]);

  const submit = async () => {
    if(!value.trim() || saving) return;
    setSaving(true);
    await onSubmit(value.trim());
    setSaving(false);
    onOpenChange(false);
  };

  return html`
    <${Dialog} open=${open} onOpenChange=${onOpenChange} title=${title}>
      <div class="mb-4">
        <${Label}>${label}<//>
        <${Input} placeholder=${placeholder} value=${value} onChange=${e => setValue(e.target.value)} onKeyDown=${e => { if(e.key === 'Enter') submit(); }} />
      </div>
      <${Button} className="w-full" disabled=${!value.trim() || saving} onClick=${submit}>Guardar<//>
    <//>
  `;
}

function Pagination({ page, total, pageSize, onChange }){
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  return html`
    <div class="flex items-center justify-center gap-4 mt-4 text-sm text-muted-foreground">
      <${Button} variant="outline" size="sm" disabled=${page<=1} onClick=${() => onChange(page-1)}>${Icon('chevronLeft')} Anterior<//>
      <span>Página ${page} de ${totalPages}</span>
      <${Button} variant="outline" size="sm" disabled=${page>=totalPages} onClick=${() => onChange(page+1)}>Siguiente ${Icon('chevronRight')}<//>
    </div>
  `;
}

};
function Icon(name, className='w-4 h-4'){
  return html`<svg class=${className} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]}</svg>`;
}

// ---------- helpers ----------

function badgeVariant(nombre){
  const n = (nombre||'').toLowerCase();
  if(n.includes('no aceptad') || n.includes('rechaz')) return 'destructive';
  if(n.includes('entregad') || n.includes('terminado') || n.includes('aceptad')) return 'success';
  if(n.includes('esperando') || n.includes('deposito') || n.includes('depósito') || n.includes('informar')) return 'warning';
  if(n.includes('recepcion')) return 'outline';
  return 'default';
}
function fillTemplate(tpl, orden){
  if(!tpl) return '';
  return tpl.replaceAll('{cliente_nombre}', orden.cliente_nombre||'').replaceAll('{numero}', orden.numero||'').replaceAll('{presupuesto_monto}', orden.presupuesto_monto ?? '');
}
function waLink(tel, texto){ return `https://wa.me/${(tel||'').replace(/\D/g,'')}?text=${encodeURIComponent(texto)}`; }
function fmtFecha(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'short' }) + ' ' + d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}
function matchesOrderSearch(o, q){
  if(!q) return true;
  const hay = [o.cliente_nombre, o.cliente_telefono, o.trabajo, o.modelo, o.numero_serie, o.tipo_equipo?.nombre, o.marca?.nombre, o.estado_admin?.nombre, o.estado_tecnico?.nombre, o.ubicacion_actual?.nombre, o.accesorios, o.observaciones, o.tecnico?.full_name, String(o.numero)].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}

// ---------- data hooks ----------

function useAppData(session){
  const [data, setData] = useState({ profile:null, tiposEquipo:[], marcas:[], estadosAdmin:[], estadosTecnicos:[], ubicaciones:[], tecnicos:[], ordenes:[] });
  const [loading, setLoading] = useState(true);

  const reloadOrdenes = useCallback(async () => {
    const { data: rows, error } = await sb.from('ordenes')
      .select(`*, tipo_equipo:tipos_equipo(nombre), marca:marcas(nombre),
        estado_admin:estados_admin!ordenes_estado_admin_id_fkey(id,nombre,mensaje_whatsapp),
        estado_tecnico:estados_tecnicos!ordenes_estado_tecnico_id_fkey(id,nombre,mensaje_whatsapp,dispara_estado_admin_id,ubicacion_id),
        ubicacion_actual:ubicaciones!ordenes_ubicacion_actual_id_fkey(id,nombre),
        tecnico:profiles!ordenes_tecnico_id_fkey(full_name)`)
      .order('numero', { ascending:false });
    setData(d => ({ ...d, ordenes: error ? [] : rows }));
  }, []);

  const reloadRef = useCallback(async () => {
    const [te, ma, ea, et, ub, tec] = await Promise.all([
      sb.from('tipos_equipo').select('*').eq('activo', true).order('orden'),
      sb.from('marcas').select('*').eq('activo', true).order('orden'),
      sb.from('estados_admin').select('*').eq('activo', true).order('orden'),
      sb.from('estados_tecnicos').select('*').eq('activo', true).order('orden'),
      sb.from('ubicaciones').select('*').eq('activo', true).order('orden'),
      sb.from('profiles').select('*').eq('role','tecnico').eq('activo', true),
    ]);
    setData(d => ({ ...d, tiposEquipo: te.data||[], marcas: ma.data||[], estadosAdmin: ea.data||[], estadosTecnicos: et.data||[], ubicaciones: ub.data||[], tecnicos: tec.data||[] }));
  }, []);

  useEffect(() => {
    if(!session){ setLoading(false); return; }
    (async () => {
      setLoading(true);
      const { data: prof } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
      setData(d => ({ ...d, profile: prof }));
      await reloadRef();
      await reloadOrdenes();
      setLoading(false);
    })();
  }, [session]);

  return { data, setData, loading, reloadOrdenes, reloadRef };
}

// ---------- Login ----------

function Login({ onLoggedIn }){
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');

  const submit = async () => {
    setErr('');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ setErr('No pudimos iniciar sesión. Revisá el email y la contraseña.'); return; }
    onLoggedIn(data.session);
  };

  return html`
    <div class="min-h-screen flex items-center justify-center bg-background">
      <${Card} className="w-80 p-6">
        <div class="flex items-center gap-2 font-bold text-base mb-1"><span class="w-2.5 h-2.5 rounded-sm bg-primary"></span>ReWop</div>
        <p class="text-sm text-muted-foreground mb-5">Iniciá sesión para continuar</p>
        <div class="mb-3"><${Label}>Email<//><${Input} type="email" placeholder="tu@email.com" value=${email} onChange=${e => setEmail(e.target.value)} /></div>
        <div class="mb-4"><${Label}>Contraseña<//><${Input} type="password" value=${password}
          onChange=${e => setPassword(e.target.value)}
          onKeyDown=${e => { if(e.key === 'Enter') submit(); }} /></div>
        <${Button} className="w-full" onClick=${submit}>Ingresar<//>
        ${err ? html`<p class="text-destructive text-sm mt-2">${err}</p>` : null}
      <//>
    </div>
  `;
}

// ---------- Órdenes list (Panel & Órdenes de servicio) ----------

function OrdenesList({ withMetrics, appData, reloadOrdenes, openNewOrder, goDetail }){
  const { ordenes } = appData;
  const [search, setSearch] = useState('');
  const [page, setPage] = useState(1);

  const filtered = useMemo(() => ordenes.filter(o => matchesOrderSearch(o, search.toLowerCase())), [ordenes, search]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pageClamped = Math.min(page, totalPages);
  const list = filtered.slice((pageClamped-1)*PAGE_SIZE, pageClamped*PAGE_SIZE);

  const abiertos = ordenes.filter(o => (o.estado_admin?.nombre||'') !== 'Entregado').length;
  const paraInformar = ordenes.filter(o => (o.estado_admin?.nombre||'').toLowerCase().includes('informar')).length;
  const enReparacion = ordenes.filter(o => (o.estado_tecnico?.nombre||'').toLowerCase().includes('reparaci')).length;

  return html`
    <div>
      <h1 class="text-xl font-bold mb-1">${withMetrics ? 'Panel' : 'Órdenes de servicio'}</h1>
      <p class="text-sm text-muted-foreground mb-5">${withMetrics ? 'Vista general de todas las órdenes' : 'Listado completo de órdenes'}</p>
      ${withMetrics ? html`

          <${Card} className="p-3.5"><div class="text-2xl font-bold">${ordenes.length}</div><div class="text-xs text-muted-foreground">Total órdenes</div><//>
          <${Card} className="p-3.5"><div class="text-2xl font-bold">${abiertos}</div><div class="text-xs text-muted-foreground">Abiertas</div><//>
          <${Card} className="p-3.5"><div class="text-2xl font-bold">${paraInformar}</div><div class="text-xs text-muted-foreground">Para informar</div><//>
          <${Card} className="p-3.5"><div class="text-2xl font-bold">${enReparacion}</div><div class="text-xs text-muted-foreground">En reparación</div><//>
        </div>
      ` : null}
      <div class="flex gap-3 items-center mb-3.5">
        <${Input} className="flex-1" placeholder="Buscar por cualquier campo de la orden (cliente, teléfono, equipo, estado...)" value=${search} onChange=${e => { setSearch(e.target.value); setPage(1); }} />

// ---------- New order dialog ----------

function NewOrderDialog({ open, onOpenChange, appData, reloadOrdenes, session, goDetail }){
  const empty = { nombre:'', tel:'', trabajo:'', tipo:'', marca:'', modelo:'', serie:'', accesorios:'', obs:'' };
  const [form, setForm] = useState(empty);
  const [err, setErr] = useState('');
  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  useEffect(() => {
    if(open){
      setForm({ ...empty, tipo: appData.tiposEquipo[0]?.id || '', marca: appData.marcas[0]?.id || '' });
      setErr('');
    }
  }, [open]);

  const submit = async () => {
    if(!form.nombre.trim() || !form.tel.trim() || !form.trabajo.trim()){ setErr('Completá nombre, teléfono y trabajo.'); return; }
    const estadoAdminInicial = appData.estadosAdmin[0]?.id;
    const estadoTecInicial = appData.estadosTecnicos[0]?.id;
    const payload = {
      cliente_nombre: form.nombre.trim(), cliente_telefono: form.tel.trim(), trabajo: form.trabajo.trim(),
      tipo_equipo_id: form.tipo, marca_id: form.marca,
      modelo: form.modelo || null, numero_serie: form.serie || null,
      accesorios: form.accesorios || null, observaciones: form.obs || null,
      estado_admin_id: estadoAdminInicial, estado_tecnico_id: estadoTecInicial,
      usuario_recepciono_id: session.user.id,
    };
    const { data, error } = await sb.from('ordenes').insert(payload).select().single();
    if(error){ setErr('No se pudo crear la orden.'); console.error(error); return; }
    await sb.from('historial_estados').insert([
      { orden_id: data.id, tipo_flujo:'admin', estado_admin_id: estadoAdminInicial, usuario_id: session.user.id },
      { orden_id: data.id, tipo_flujo:'tecnico', estado_tecnico_id: estadoTecInicial, usuario_id: session.user.id },
    ]);
    await reloadOrdenes();
    onOpenChange(false);
    goDetail(data.id);
  };

  return html`
    <${Dialog} open=${open} onOpenChange=${onOpenChange} title="Nueva orden" description="Recepción de un equipo">
      <div class="mb-3"><${Label}>Nombre del cliente<//><${Input} placeholder="Juan Pérez" value=${form.nombre} onChange=${set('nombre')} /></div>
      <div class="mb-3"><${Label}>Teléfono<//><${Input} placeholder="11 2345 6789" value=${form.tel} onChange=${set('tel')} /></div>
      <div class="mb-3"><${Label}>Trabajo<//><${Input} placeholder="No enciende, pantalla rota, etc." value=${form.trabajo} onChange=${set('trabajo')} /></div>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><${Label}>Tipo de equipo<//><${Select} value=${form.tipo} onChange=${set('tipo')}>${appData.tiposEquipo.map(t => html`<option key=${t.id} value=${t.id}>${t.nombre}</option>`)}<//></div>
        <div><${Label}>Marca<//><${Select} value=${form.marca} onChange=${set('marca')}>${appData.marcas.map(m => html`<option key=${m.id} value=${m.id}>${m.nombre}</option>`)}<//></div>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><${Label}>Modelo<//><${Input} value=${form.modelo} onChange=${set('modelo')} /></div>
        <div><${Label}>N.º de serie<//><${Input} value=${form.serie} onChange=${set('serie')} /></div>
      </div>
      <div class="mb-3"><${Label}>Accesorios que dejó<//><${Input} value=${form.accesorios} onChange=${set('accesorios')} /></div>
      <div class="mb-4"><${Label}>Observaciones<//><${Textarea} rows="2" value=${form.obs} onChange=${set('obs')} /></div>
      <${Button} className="w-full" onClick=${submit}>Guardar<//>
      ${err ? html`<p class="text-destructive text-sm mt-2">${err}</p>` : null}
    <//>
  `;
}

// ---------- Order detail ----------

function OrderDetail({ orderId, appData, session, reloadOrdenes, goBack }){
  const [historial, setHistorial] = useState([]);
  const o = appData.ordenes.find(x => x.id === orderId);
  const role = appData.profile?.role;
  const canEditTecnico = role === 'admin' || role === 'tecnico';
  const canEditAdmin = role === 'admin' || role === 'operador';
  const [actSel, setActSel] = useState('');
  const [ubicSel, setUbicSel] = useState('');
  const [tecnicoSel, setTecnicoSel] = useState(o?.tecnico_id || '');
  const [monto, setMonto] = useState(o?.presupuesto_monto ?? '');
  const [presEstado, setPresEstado] = useState(o?.presupuesto_estado || 'pendiente');

  useEffect(() => {
    if(!actSel){ setUbicSel(''); return; }
    const [tipo, estadoId] = actSel.split(':');
    const estado = tipo === 'admin' ? appData.estadosAdmin.find(e => e.id === estadoId) : appData.estadosTecnicos.find(e => e.id === estadoId);
    setUbicSel(estado?.ubicacion_id || '');
  }, [actSel]);

  const loadHist = useCallback(async () => {
    const { data, error } = await sb.from('historial_estados')
      .select(`*, estado_admin:estados_admin(nombre), estado_tecnico:estados_tecnicos(nombre), usuario:profiles(full_name)`)
      .eq('orden_id', orderId).order('fecha', { ascending:false });
    setHistorial(error ? [] : data);
  }, [orderId]);

  useEffect(() => { loadHist(); }, [orderId]);
  useEffect(() => { setTecnicoSel(o?.tecnico_id || ''); setMonto(o?.presupuesto_monto ?? ''); setPresEstado(o?.presupuesto_estado || 'pendiente'); }, [o?.id]);

  if(!o) return html`<p>Orden no encontrada.</p>`;

  const agregarActividad = async () => {
    if(!actSel) return;
    const [tipo, estadoId] = actSel.split(':');
    if(tipo === 'admin'){
      const updates = { estado_admin_id: estadoId, updated_at: new Date().toISOString() };
      if(ubicSel) updates.ubicacion_actual_id = ubicSel;
      await sb.from('ordenes').update(updates).eq('id', orderId);
      await sb.from('historial_estados').insert({ orden_id: orderId, tipo_flujo:'admin', estado_admin_id: estadoId, usuario_id: session.user.id });
    } else {
      const estado = appData.estadosTecnicos.find(e => e.id === estadoId);
      const updates = { estado_tecnico_id: estadoId, updated_at: new Date().toISOString() };
      if(estado?.dispara_estado_admin_id) updates.estado_admin_id = estado.dispara_estado_admin_id;
      if(ubicSel) updates.ubicacion_actual_id = ubicSel;
      await sb.from('ordenes').update(updates).eq('id', orderId);
      const inserts = [{ orden_id: orderId, tipo_flujo:'tecnico', estado_tecnico_id: estadoId, usuario_id: session.user.id }];
      if(estado?.dispara_estado_admin_id) inserts.push({ orden_id: orderId, tipo_flujo:'admin', estado_admin_id: estado.dispara_estado_admin_id, usuario_id: session.user.id });
      await sb.from('historial_estados').insert(inserts);
    }
    await reloadOrdenes(); await loadHist(); setActSel(''); setUbicSel('');
  };

  const guardarTecnico = async () => { await sb.from('ordenes').update({ tecnico_id: tecnicoSel || null, updated_at: new Date().toISOString() }).eq('id', orderId); await reloadOrdenes(); };
  const guardarPresupuesto = async () => { await sb.from('ordenes').update({ presupuesto_monto: monto || null, presupuesto_estado: presEstado, updated_at: new Date().toISOString() }).eq('id', orderId); await reloadOrdenes(); };
  const enviarWhatsapp = async () => {
    const texto = fillTemplate(o.estado_admin.mensaje_whatsapp, o);
    await sb.from('mensajes_enviados').insert({ orden_id: orderId, estado_relacionado: o.estado_admin.nombre, contenido: texto, canal:'whatsapp' });
    window.open(waLink(o.cliente_telefono, texto), '_blank');
  };

  return html`
    <div>
      <div class="flex items-center gap-1.5 text-sm text-muted-foreground cursor-pointer w-fit mb-3.5 hover:text-foreground" onClick=${goBack}>${Icon('chevronLeft')}<span>Volver al panel</span></div>
      <h1 class="text-xl font-bold font-mono mb-1">Orden #${o.numero}</h1>
      <p class="text-sm text-muted-foreground mb-5">${o.cliente_nombre} · ${o.cliente_telefono}</p>

      <div class="grid gap-5" style=${{gridTemplateColumns:'1fr 300px'}}>
        <div>
          <${Card} className="p-4.5 mb-4">
            <div class="text-xs font-semibold uppercase tracking-wide text-muted-foreground mb-3">Agregar actividad</div>
            <div class="flex gap-3 items-end">
              <${Select} className="flex-1" value=${actSel} onChange=${e => setActSel(e.target.value)}>
                <option value="">Elegir actividad...</option>
                ${canEditAdmin ? html`<optgroup label="Flujo administrativo">${appData.estadosAdmin.map(e => html`<option key=${e.id} value=${'admin:'+e.id}>${e.nombre}</option>`)}<//>` : null}
                ${canEditTecnico ? html`<optgroup label="Flujo técnico">${appData.estadosTecnicos.map(e => html`<option key=${e.id} value=${'tecnico:'+e.id}>${e.nombre}</option>`)}<//>` : null}
              <//>
              <div class="w-40 shrink-0">
                <${Select} value=${ubicSel} onChange=${e => setUbicSel(e.target.value)}>
                  <option value="">Sin cambio de ubicación</option>
                  ${appData.ubicaciones.map(u => html`<option key=${u.id} value=${u.id}>${u.nombre}</option>`)}
                <//>
              </div>
              <${Button} className="shrink-0" onClick=${agregarActividad}>${Icon('plus')} Agregar<//>
            </div>
          <//>

          <${Card} className="p-4.5">
            <div class="text-xs font-semibold uppercase tracking-wide text-muted-foreground mb-3">Historial de actividades</div>
            <div class="relative pl-5">
              <div class="absolute left-[5px] top-1 bottom-1 w-px bg-border"></div>
              ${historial.length === 0 ? html`<p class="text-sm text-muted-foreground">Sin actividad registrada.</p>` :
                historial.map(h => html`
                  <div key=${h.id} class="relative pb-4.5">
                    <div class="absolute -left-5 top-0.5 w-2 h-2 rounded-full bg-primary ring-2 ring-card"></div>
                    <div class="text-sm font-medium">
                      ${h.tipo_flujo === 'admin' ? (h.estado_admin?.nombre||'') : (h.estado_tecnico?.nombre||'')}
                      <${Badge} className="ml-1.5" variant=${h.tipo_flujo==='admin'?'default':'outline'}>${h.tipo_flujo==='admin'?'Administrativo':'Técnico'}<//>
                    </div>
                    <div class="text-xs text-muted-foreground mt-0.5">${fmtFecha(h.fecha)} · ${h.usuario?.full_name || 'Sistema'}</div>
                  </div>
                `)}
            </div>
          <//>
        </div>

        <div>
          <${Card} className="p-4.5 mb-4">
            <div class="text-xs font-semibold uppercase tracking-wide text-muted-foreground mb-3">Equipo</div>
            <p class="text-sm mb-1">${o.tipo_equipo?.nombre||''} ${o.marca?.nombre||''} ${o.modelo||''}</p>
            ${o.numero_serie ? html`<p class="text-xs text-muted-foreground mb-1">N/S ${o.numero_serie}</p>` : null}
            <p class="text-sm text-muted-foreground mt-2">${o.trabajo}</p>
            ${o.accesorios ? html`<p class="text-xs text-muted-foreground mt-2">Accesorios: ${o.accesorios}</p>` : null}
            ${o.observaciones ? html`<p class="text-xs text-muted-foreground mt-2">Obs: ${o.observaciones}</p>` : null}
          <//>

          <${Card} className="p-4.5 mb-4">
            <div class="text-xs font-semibold uppercase tracking-wide text-muted-foreground mb-3">Estado actual</div>
            <p class="text-xs text-muted-foreground mb-1.5">Administrativo</p>
            <${Badge} variant=${badgeVariant(o.estado_admin?.nombre)}>${o.estado_admin?.nombre||'—'}<//>
            <p class="text-xs text-muted-foreground mt-3 mb-1.5">Técnico</p>
            <${Badge} variant=${badgeVariant(o.estado_tecnico?.nombre)}>${o.estado_tecnico?.nombre||'—'}<//>
            <p class="text-xs text-muted-foreground mt-3 mb-1.5">Ubicación actual</p>
            <${Badge} variant="outline">${o.ubicacion_actual?.nombre||'—'}<//>
            ${o.estado_admin?.mensaje_whatsapp ? html`
              <div class="bg-muted rounded-md p-2.5 text-sm whitespace-pre-wrap mt-3 mb-3 border border-border">${fillTemplate(o.estado_admin.mensaje_whatsapp, o)}</div>
              <${Button} variant="secondary" className="w-full" onClick=${enviarWhatsapp}>${Icon('message')} Abrir WhatsApp<//>
            ` : null}
          <//>

          <${Card} className="p-4.5 mb-4">
            <div class="text-xs font-semibold uppercase tracking-wide text-muted-foreground mb-3">Técnico asignado</div>
            <${Select} disabled=${!canEditAdmin} value=${tecnicoSel} onChange=${e => setTecnicoSel(e.target.value)}>
              <option value="">Sin asignar</option>
              ${appData.tecnicos.map(t => html`<option key=${t.id} value=${t.id}>${t.full_name}</option>`)}
            <//>
            ${canEditAdmin ? html`<${Button} variant="secondary" className="w-full mt-2" onClick=${guardarTecnico}>Guardar<//>` : null}
          <//>

          <${Card} className="p-4.5">
            <div class="text-xs font-semibold uppercase tracking-wide text-muted-foreground mb-3">Presupuesto</div>
            <div class="mb-3"><${Label}>Monto<//><${Input} type="number" disabled=${!canEditAdmin} value=${monto} onChange=${e => setMonto(e.target.value)} /></div>
            <div class="mb-3">
              <${Label}>Estado<//>
              <${Select} disabled=${!canEditAdmin} value=${presEstado} onChange=${e => setPresEstado(e.target.value)}>
                <option value="pendiente">Pendiente</option>
                <option value="aceptado">Aceptado</option>
                <option value="rechazado">Rechazado</option>
              <//>
            </div>
            ${canEditAdmin ? html`<${Button} variant="secondary" className="w-full" onClick=${guardarPresupuesto}>Guardar presupuesto<//>` : null}
          <//>
        </div>
      </div>
    </div>
  `;
}

// ---------- Config screens ----------

function useCfgRows(table, extraSelect=''){
  const [rows, setRows] = useState([]);
  const reload = useCallback(async () => {
    const { data } = await sb.from(table).select('*').order('orden');
    setRows(data || []);
  }, [table]);
  useEffect(() => { reload(); }, [reload]);
  return [rows, reload];
}

function ConfigToolbar({ search, setSearch, onOpenAdd, addLabel }){
  return html`
    <div class="flex gap-3 mb-3.5 items-center">
      <${Input} className="flex-1" placeholder="Buscar por nombre" value=${search} onChange=${e => setSearch(e.target.value)} />
      <${Button} className="shrink-0" onClick=${onOpenAdd}>${Icon('plus')} ${addLabel}<//>
    </div>
  `;
}

function ConfigSimple({ table, title, addLabel, itemLabel, reloadRef }){
  const [rows, reload] = useCfgRows(table);
  const [search, setSearch] = useState('');
  const [page, setPage] = useState(1);
  const [addOpen, setAddOpen] = useState(false);

  const filtered = rows.filter(r => !search || r.nombre.toLowerCase().includes(search.toLowerCase()));
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pageClamped = Math.min(page, totalPages);
  const list = filtered.slice((pageClamped-1)*PAGE_SIZE, pageClamped*PAGE_SIZE);

  const save = async (id, nombre) => { await sb.from(table).update({ nombre }).eq('id', id); await reload(); await reloadRef(); };
  const toggle = async (id, activo) => { await sb.from(table).update({ activo: !activo }).eq('id', id); await reload(); await reloadRef(); };
  const add = async (nombre) => { await sb.from(table).insert({ nombre }); await reload(); await reloadRef(); };

  return html`
    <div>
      <h1 class="text-xl font-bold mb-1">${title}</h1>
      <p class="text-sm text-muted-foreground mb-5">No se pueden eliminar porque están vinculados a órdenes existentes — se activan o desactivan.</p>
      <${ConfigToolbar} search=${search} setSearch=${(v) => { setSearch(v); setPage(1); }} onOpenAdd=${() => setAddOpen(true)} addLabel=${addLabel} />
      <div class="grid gap-2.5 px-3.5 text-[11px] uppercase tracking-wide text-muted-foreground mb-1.5" style=${{gridTemplateColumns:'1fr 60px'}}>
        <span>Nombre</span><span>Activo</span>
      </div>
      ${list.length === 0 ? html`<p class="text-sm text-muted-foreground">Sin resultados.</p>` : null}
      ${list.map(r => html`
        <div key=${r.id} class="grid gap-2.5 items-center px-3.5 py-2.5 bg-card border border-border rounded-md mb-2" style=${{gridTemplateColumns:'1fr 60px'}}>
          <${Input} className="border-transparent bg-transparent shadow-none h-8" defaultValue=${r.nombre} onBlur=${e => e.target.value !== r.nombre && save(r.id, e.target.value)} />
          <${Switch} checked=${r.activo} onChange=${() => toggle(r.id, r.activo)} />
        </div>
      `)}
      <${Pagination} page=${pageClamped} total=${filtered.length} pageSize=${PAGE_SIZE} onChange=${setPage} />
      <${NewItemDialog} open=${addOpen} onOpenChange=${setAddOpen} title=${addLabel} label="Nombre" placeholder=${itemLabel} onSubmit=${add} />
    </div>
  `;
}

      <h1 class="text-xl font-bold mb-1">Estados técnicos</h1>
      <p class="text-sm text-muted-foreground mb-5">Podés hacer que un estado técnico dispare un estado administrativo y/o deje al equipo en una ubicación.</p>
      <${ConfigToolbar} search=${search} setSearch=${(v) => { setSearch(v); setPage(1); }} onOpenAdd=${() => setAddOpen(true)} addLabel="Nuevo estado técnico" />
      <div class="grid gap-2.5 px-3.5 text-[11px] uppercase tracking-wide text-muted-foreground mb-1.5" style=${{gridTemplateColumns:'140px 1fr 140px 60px'}}>
        <span>Nombre</span><span>Dispara en admin</span><span>Ubicación</span><span>Activo</span>
      </div>
      ${list.length === 0 ? html`<p class="text-sm text-muted-foreground">Sin resultados.</p>` : null}
      ${list.map(e => html`
        <div key=${e.id} class="grid gap-2.5 items-center px-3.5 py-2.5 bg-card border border-border rounded-md mb-2" style=${{gridTemplateColumns:'140px 1fr 140px 60px'}}>
          <${Input} className="border-transparent bg-transparent shadow-none h-8" defaultValue=${e.nombre} onBlur=${ev => ev.target.value !== e.nombre && saveField(e.id, 'nombre', ev.target.value)} />
          <${Select} defaultValue=${e.dispara_estado_admin_id || ''} onChange=${ev => saveField(e.id, 'dispara_estado_admin_id', ev.target.value || null)}>
            <option value="">Ninguno</option>
            ${estadosAdminAll.map(a => html`<option key=${a.id} value=${a.id}>${a.nombre}</option>`)}
          <//>
          <${Select} defaultValue=${e.ubicacion_id || ''} onChange=${ev => saveField(e.id, 'ubicacion_id', ev.target.value || null)}>
            <option value="">Sin cambio</option>
            ${ubicacionesAll.map(u => html`<option key=${u.id} value=${u.id}>${u.nombre}</option>`)}
          <//>
          <${Switch} checked=${e.activo} onChange=${() => toggle(e.id, e.activo)} />
        </div>
      `)}
      <${Pagination} page=${pageClamped} total=${filtered.length} pageSize=${PAGE_SIZE} onChange=${setPage} />
      <${NewItemDialog} open=${addOpen} onOpenChange=${setAddOpen} title="Nuevo estado técnico" label="Nombre" placeholder="Nombre del estado" onSubmit=${add} />
    </div>
  `;
}

// ---------- App ----------

function App(){
  const [session, setSession] = useState(null);
  const [checkingSession, setCheckingSession] = useState(true);
  const [view, setView] = useState('panel');
  const [detailId, setDetailId] = useState(null);
  const [configOpen, setConfigOpen] = useState(true);
  const [newOrderOpen, setNewOrderOpen] = useState(false);
  const { data: appData, loading, reloadOrdenes, reloadRef } = useAppData(session);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setCheckingSession(false); });
  }, []);

  const goDetail = (id) => { setDetailId(id); setView('detail'); };
  const goView = (v) => { setView(v); if(v !== 'detail') setDetailId(null); };
  const logout = async () => { await sb.auth.signOut(); setSession(null); };

  if(checkingSession) return null;
  if(!session) return html`<${Login} onLoggedIn=${setSession} />`;
  if(loading || !appData.profile) return html`<div class="min-h-screen flex items-center justify-center text-muted-foreground text-sm">Cargando…</div>`;

  return html`
    <div class="flex h-screen overflow-hidden">
      <${Sidebar} view=${view} setView=${goView} profile=${appData.profile} configOpen=${configOpen} setConfigOpen=${setConfigOpen} onLogout=${logout} />
      <div class="flex-1 p-7 md:p-8 max-w-full overflow-y-auto">
        ${view === 'panel' ? html`<${OrdenesList} withMetrics=${true} appData=${appData} reloadOrdenes=${reloadOrdenes} openNewOrder=${() => setNewOrderOpen(true)} goDetail=${goDetail} />` : null}
        ${view === 'detail' ? html`<${OrderDetail} orderId=${detailId} appData=${appData} session=${session} reloadOrdenes=${reloadOrdenes} goBack=${() => goView('panel')} />` : null}
        ${view === 'cfg-tipos' ? html`<${ConfigSimple} table="tipos_equipo" title="Tipos de equipo" addLabel="Nuevo tipo de equipo" itemLabel="Nombre del tipo de equipo" reloadRef=${reloadRef} />` : null}
        ${view === 'cfg-marcas' ? html`<${ConfigSimple} table="marcas" title="Marcas" addLabel="Nueva marca" itemLabel="Nombre de la marca" reloadRef=${reloadRef} />` : null}
        ${view === 'cfg-ubicaciones' ? html`<${ConfigSimple} table="ubicaciones" title="Ubicaciones" addLabel="Nueva ubicación" itemLabel="Nombre de la ubicación" reloadRef=${reloadRef} />` : null}
        ${view === 'cfg-eadmin' ? html`<${ConfigEstadosAdmin} appData=${appData} reloadRef=${reloadRef} />` : null}
        ${view === 'cfg-etec' ? html`<${ConfigEstadosTecnicos} appData=${appData} reloadRef=${reloadRef} />` : null}
      </div>
      <${NewOrderDialog} open=${newOrderOpen} onOpenChange=${setNewOrderOpen} appData=${appData} reloadOrdenes=${reloadOrdenes} session=${session} goDetail=${goDetail} />
    </div>
  `;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
